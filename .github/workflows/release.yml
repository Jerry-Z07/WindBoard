name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # MSIX 产包必须用 Visual Studio 的 MSBuild.exe（runner 已预装 VS，本 Action 只是把它放进 PATH）：
      # 打包任务程序集（tools/net6.0）依赖 System.Security.Permissions.dll，该程序集只在
      # Microsoft.WindowsDesktop.App 共享框架中；dotnet msbuild 宿主跑在 Microsoft.NETCore.App 上，
      # 会在 Appx 产包阶段以 MSB4018 / FileNotFoundException 失败（design.md §2.2 实测结论 V2）。
      # 版本 tag 沿用 single-project MSIX 官方文档所引示例仓库的写法，后续可整体升级。
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Restore
        run: dotnet restore

      - name: Publish + Package + latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $tag = '${{ github.ref_name }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Missing tag name.' }
          $version = $tag.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Invalid tag version.' }

          $repo = '${{ github.repository }}'
          $project = Join-Path $PWD 'WindBoard/WindBoard.csproj'
          $launcherProject = Join-Path $PWD 'WindBoard.Launcher/WindBoard.Launcher.csproj'
          if (!(Test-Path $project)) { throw "Project file not found: $project" }
          if (!(Test-Path $launcherProject)) { throw "Launcher project file not found: $launcherProject" }

          # Microsoft Store 产品 ID：从发布流程变量 vars.MSIX_STORE_PRODUCT_ID 注入；
          # 未配置时退化为占位符 —— 说明文档/最新版 changelog 中的商店链接会指向占位地址，
          # 取得 Partner Center 分配的真实 Product ID 后请配置该仓库变量（或直接替换本占位常量）。
          $storeProductId = '${{ vars.MSIX_STORE_PRODUCT_ID }}'
          if ([string]::IsNullOrWhiteSpace($storeProductId)) { $storeProductId = 'REPLACE_WITH_STORE_PRODUCT_ID' }
          $storeUrl = "https://apps.microsoft.com/detail/$storeProductId"

          # 版本号写入到程序集/文件属性中，便于 About 页与日志展示一致，并方便定位构建来源。
          $sha = '${{ github.sha }}'
          $shortSha = $sha
          if ($shortSha.Length -gt 8) { $shortSha = $shortSha.Substring(0, 8) }

          $versionPrefixMatch = [regex]::Match($version, '^(?<prefix>\d+\.\d+\.\d+)')
          if (!$versionPrefixMatch.Success) { throw "Invalid tag version format (expected x.y.z...): $version" }
          $versionPrefix = $versionPrefixMatch.Groups['prefix'].Value
          $informationalVersion = "$version+$shortSha"

          # 分析告警回归约束：CodeAnalysisTreatWarningsAsErrors 仅把分析器告警（CA/IDE）
          # 升级为错误，普通编译器与平台（WinUI/XAML）告警不受影响；Directory.Build.props
          # 中已按规则 ID 带注释豁免的规则保持豁免。发布构建作为新增分析告警的最后把关闸。
          $msbuildProps = @(
            '-p:PublishProfile='
            '-p:CodeAnalysisTreatWarningsAsErrors=true'
            "-p:Version=$version"
            "-p:VersionPrefix=$versionPrefix"
            "-p:AssemblyVersion=$versionPrefix.0"
            "-p:FileVersion=$versionPrefix.0"
            "-p:InformationalVersion=$informationalVersion"
          )

          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $variants = @(
            @{ Rid = 'win-x86';   Arch = 'x86';   Platform = 'x86'  }
            @{ Rid = 'win-x64';   Arch = 'x64';   Platform = 'x64'  }
            @{ Rid = 'win-arm64'; Arch = 'arm64'; Platform = 'ARM64' }
          )

          $assets = @()

          foreach ($v in $variants) {
            $rid = $v.Rid
            $arch = $v.Arch

            # --- 便携版（带运行库，自包含）---
            $publishDirSc = Join-Path $PWD ("publish/{0}/sc" -f $rid)
            $publishDirScShared = Join-Path $publishDirSc 'shared'
            dotnet publish $project `
              -c Release `
              -r $rid `
              --self-contained true `
              -o $publishDirScShared `
              -p:PublishReadyToRun=false `
              -p:WindowsAppSDKSelfContained=true `
              $msbuildProps

            dotnet publish $launcherProject `
              -c Release `
              -r $rid `
              -o $publishDirSc `
              -p:AssemblyName=WindBoard `
              -p:TargetName=WindBoard `
              -p:DebugSymbols=false `
              -p:DebugType=None `
              $msbuildProps

            $portableFileName = "WindBoard-$version-$rid.zip"
            $portableZipPath = Join-Path $dist $portableFileName
            if (Test-Path $portableZipPath) { Remove-Item -Force $portableZipPath }
            Compress-Archive -Path (Join-Path $publishDirSc '*') -DestinationPath $portableZipPath -Force

            $portableSha256 = (Get-FileHash -Path $portableZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $portableSize = (Get-Item $portableZipPath).Length
            $portableDownloadUrl = "https://github.com/$repo/releases/download/$tag/$portableFileName"

            $assets += [pscustomobject]@{
              arch = $arch
              runtime = 'self-contained'
              fileName = $portableFileName
              downloadUrl = $portableDownloadUrl
              size = $portableSize
              sha256 = $portableSha256
            }

            # --- Microsoft Store 上传包（MSIX，自包含）---
            # 必须使用 MSBuild.exe（见上方 Setup MSBuild 步骤的说明），不能用 dotnet msbuild。
            # PublishDir 必须显式传绝对路径：pubxml 内的 PublishDir 是相对路径，传给 CrashReporter
            # 子项目时会被其按自身目录解析（design.md §6 记录的顺序/相对路径坑）。
            # 三架构各产出一个 .msixupload（内含单架构 bundle）：Partner Center 允许同一提交上传多个包，
            # 因此这里不额外拼多架构 bundle（design.md §2.2：Store 接受同提交多个单架构包）。
            $msixOutDir = Join-Path $PWD ("msix/{0}" -f $rid)
            $msixPublishDir = Join-Path $PWD ("publish/{0}/msix" -f $rid)
            msbuild $project `
              /t:Publish `
              /restore `
              "/p:Configuration=Release" `
              "/p:Platform=$($v.Platform)" `
              "/p:RuntimeIdentifier=$rid" `
              "/p:WindBoardPackage=Msix" `
              "/p:GenerateAppxPackageOnBuild=true" `
              "/p:AppxPackageDir=$msixOutDir\" `
              "/p:PublishDir=$msixPublishDir\" `
              "/p:UapAppxPackageBuildMode=StoreUpload" `
              "/p:AppxPackageSigningEnabled=false" `
              "/p:WindowsAppSDKSelfContained=true" `
              "/p:SelfContained=true" `
              $msbuildProps

            $msixUpload = Get-ChildItem -Path $msixOutDir -Recurse -Filter '*_bundle.msixupload' -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $msixUpload) { throw "MSIX upload package not produced: $msixOutDir" }

            $msixAssetName = "WindBoard-$version-$rid.msixupload"
            $msixAssetPath = Join-Path $dist $msixAssetName
            Copy-Item -Path $msixUpload.FullName -Destination $msixAssetPath -Force
            if (!(Test-Path $msixAssetPath)) { throw "MSIX upload asset not found: $msixAssetPath" }

            Write-Host ("MSIX upload ready: {0} ({1} MB)" -f $msixAssetName, [math]::Round((Get-Item $msixAssetPath).Length / 1MB, 1))
          }

          $prevTag = $null
          try { $prevTag = (git describe --tags --abbrev=0 --match "v*" "$tag^" 2>$null).Trim() } catch { }

          if (![string]::IsNullOrWhiteSpace($prevTag)) {
            $commitLines = (git log "$prevTag..$tag" --no-merges --pretty=format:"- %s") -join "`n"
            $rangeLabelEn = "$prevTag..$tag"
            $rangeLabelZh = "$prevTag..$tag"
          } else {
            $commitLines = (git log -n 30 --no-merges --pretty=format:"- %s") -join "`n"
            $rangeLabelEn = "latest 30 commits"
            $rangeLabelZh = "最近 30 条提交"
          }

          $changelogEn = "## Changes ($rangeLabelEn)`n$commitLines"
          $changelogZh = "## 更新内容（$rangeLabelZh）`n$commitLines"

          $customNotesDir = Join-Path $PWD 'docs/release-notes'
          $customZhPath = Join-Path $customNotesDir "$tag.zh-CN.md"
          $customEnPath = Join-Path $customNotesDir "$tag.en-US.md"

          if (Test-Path $customZhPath) {
            $changelogZh = (Get-Content -Path $customZhPath -Raw -Encoding UTF8).Trim()
          }

          if (Test-Path $customEnPath) {
            $changelogEn = (Get-Content -Path $customEnPath -Raw -Encoding UTF8).Trim()
          } else {
            $changelogEn = @(
              "## Changes"
              "(English changelog not provided for $tag. Please refer to the Chinese section.)"
            ) -join "`n"
          }

          # 迁移提示：置顶写入 changelog，从而同时进入 Release 正文与 latest.json 的 changelog
          # （旧 Inno 安装版客户端会读取 changelog 展示；其下载按钮仍只识别便携版 zip 资产）。
          $migrationNoticeZh = @(
            '> **重要：安装版分发方式已变更**'
            "> 安装版（Inno Setup）已停止发布，改为通过 Microsoft Store 分发 MSIX 版本：[在 Microsoft Store 获取 WindBoard]($storeUrl)"
            '> GitHub Releases 仅提供便携版 zip。已安装旧安装版的用户可继续使用原版本，或从 Store 安装新版后首次启动时导入旧设置（设置导出文件与 .wbix 在两种形态间互通）。'
          ) -join "`n"

          $migrationNoticeEn = @(
            '> **Important: installer distribution changed**'
            "> The Inno Setup installer is discontinued. The installable version is now distributed as MSIX through the Microsoft Store: [Get WindBoard from the Microsoft Store]($storeUrl)"
            '> GitHub Releases only provides the portable zip. Users on the old installer can keep using it, or install the Store version and import their settings on first launch (exported settings files and .wbix files are interchangeable between the two forms).'
          ) -join "`n"

          $changelogZh = "$migrationNoticeZh`n`n$changelogZh"
          $changelogEn = "$migrationNoticeEn`n`n$changelogEn"

          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')

          $latest = [ordered]@{
            version = $version
            versionName = $tag
            releaseDate = $releaseDate
            changelog = @{
              'zh-CN' = $changelogZh
              'en-US' = $changelogEn
            }
            assets = $assets
          }

          $latestJsonPath = Join-Path $dist 'latest.json'
          ($latest | ConvertTo-Json -Depth 10) | Set-Content -Path $latestJsonPath -Encoding UTF8

          # GitHub Release 正文顶部追加下载表格：GitHub 只发布便携版 zip，
          # 安装版（MSIX）经 Microsoft Store 分发，链接在下方 changelog 顶部的迁移提示中。
          $releaseAssetRows = foreach ($arch in @('x64', 'x86', 'arm64')) {
            $portablePackage = $assets | Where-Object { $_.arch -eq $arch -and $_.runtime -eq 'self-contained' } | Select-Object -First 1

            if ($null -eq $portablePackage) {
              throw "Missing release asset for architecture: $arch"
            }

            "| $arch | [便携版]($($portablePackage.downloadUrl)) |"
          }

          $releaseAssetTable = @(
            '## 下载'
            ''
            '| 架构 | 便携版 |'
            '| --- | --- |'
            $releaseAssetRows
          ) -join "`n"

          $releaseNotes = @(
            $releaseAssetTable
            ''
            '---'
            ''
            $changelogZh
            ''
            '---'
            ''
            $changelogEn
          ) -join "`n"
          $releaseNotesPath = Join-Path $dist 'release-notes.md'
          $releaseNotes.Trim() | Set-Content -Path $releaseNotesPath -Encoding UTF8

      # MSIX 产物是「未签名的 Store 提交容器」，用户无法直接安装，不构成侧载渠道：
      # 按 D3「GitHub 只发便携版 zip」的约定，它不作为 Release 资产，只作为 workflow artifact
      # 供维护者下载后提交 Partner Center（design.md §2.2）。
      - name: Upload MSIX packages (Store submission)
        uses: actions/upload-artifact@v4
        with:
          name: msix-packages
          path: dist/*.msixupload
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/latest.json
          body_path: dist/release-notes.md
          generate_release_notes: false
